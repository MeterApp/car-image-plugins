interface:
  display_name: "Vehicle Catalog"
  short_description: "Look a vehicle up before you render it"
  default_prompt: "Use $vehicle-catalog to look the vehicle up and get its vehicle id before rendering it."
dependencies:
  tools:
    - type: "mcp"
      value: "car-image"
      description: "Car Image API hosted MCP server"
      transport: "streamable_http"
      url: "https://carimage.dev/api/mcp"
policy:
  allow_implicit_invocation: true
