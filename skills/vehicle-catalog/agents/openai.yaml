interface:
  display_name: "Vehicle Catalog"
  short_description: "Resolve free text to a real make, model and year"
  default_prompt: "Use $vehicle-catalog to identify the exact vehicle before rendering it."
dependencies:
  tools:
    - type: "mcp"
      value: "car-image"
      description: "Car Image API hosted MCP server"
      transport: "streamable_http"
      url: "https://carimage.dev/api/mcp"
policy:
  allow_implicit_invocation: true
