interface:
  display_name: "Car Image URLs"
  short_description: "Embed car renders with signed URLs"
  default_prompt: "Use $car-image-urls to look up a vehicle and embed its signed image URL in a website, app, email or document. For a requested image in ChatGPT, create_car_image_urls shows the inline card. Reuse URLs and never render twice. Default to front-3-4 when no view is requested."
dependencies:
  tools:
    - type: "mcp"
      value: "car-image"
      description: "Car Image API hosted MCP server"
      transport: "streamable_http"
      url: "https://carimage.dev/api/mcp"
policy:
  allow_implicit_invocation: true
