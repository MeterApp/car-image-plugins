interface:
  display_name: "Car Image URLs"
  short_description: "Embed car renders without leaking a key"
  default_prompt: "Use $car-image-urls to embed a signed vehicle image URL in a website, app, email or document, or to share a clickable link where the chat cannot show the image and open it in the browser if available. Use front-3-4 (35 degrees, facing left) when no view is requested."
dependencies:
  tools:
    - type: "mcp"
      value: "car-image"
      description: "Car Image API hosted MCP server"
      transport: "streamable_http"
      url: "https://carimage.dev/api/mcp"
policy:
  allow_implicit_invocation: true
