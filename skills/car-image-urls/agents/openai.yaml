interface:
  display_name: "Car Image URLs"
  short_description: "Embed car renders without leaking a key"
  default_prompt: "Use $car-image-urls to put a vehicle image on a page with a signed URL."
dependencies:
  tools:
    - type: "mcp"
      value: "car-image"
      description: "Car Image API hosted MCP server"
      transport: "streamable_http"
      url: "https://carimage.dev/api/mcp"
policy:
  allow_implicit_invocation: true
