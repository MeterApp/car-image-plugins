interface:
  display_name: "Car Image API"
  short_description: "Vehicle renders and catalog make logos"
  default_prompt: "Use $car-image to fetch a studio-quality render of a specific vehicle or a catalog make logo."
dependencies:
  tools:
    - type: "mcp"
      value: "car-image"
      description: "Car Image API hosted MCP server"
      transport: "streamable_http"
      url: "https://carimage.dev/api/mcp"
policy:
  allow_implicit_invocation: true
