interface:
  display_name: "Car Image API"
  short_description: "Vehicle renders and catalog make logos"
  default_prompt: "Look the vehicle up first. In ChatGPT call create_car_image_urls with its id to show the inline image card; reuse existing URLs and never render twice. In other hosts follow $car-image display instructions. Default to front-3-4 when no view is requested."
dependencies:
  tools:
    - type: "mcp"
      value: "car-image"
      description: "Car Image API hosted MCP server"
      transport: "streamable_http"
      url: "https://carimage.dev/api/mcp"
policy:
  allow_implicit_invocation: true
