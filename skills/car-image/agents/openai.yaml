interface:
  display_name: "Car Image API"
  short_description: "Transparent-background vehicle renders"
  default_prompt: "Use $car-image to fetch a studio-quality render of a specific vehicle."
dependencies:
  tools:
    - type: "mcp"
      value: "car-image"
      description: "Car Image API hosted MCP server"
      transport: "streamable_http"
      url: "https://carimage.dev/api/mcp"
policy:
  allow_implicit_invocation: true
