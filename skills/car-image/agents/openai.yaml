interface:
  display_name: "Car Image API"
  short_description: "Vehicle renders and catalog make logos"
  default_prompt: "Use $car-image to look up a random vehicle, share a clickable image link and open it in the browser if available, without embedding it inline in chat. Use front-3-4 (35 degrees, facing left) when no view is requested."
dependencies:
  tools:
    - type: "mcp"
      value: "car-image"
      description: "Car Image API hosted MCP server"
      transport: "streamable_http"
      url: "https://carimage.dev/api/mcp"
policy:
  allow_implicit_invocation: true
